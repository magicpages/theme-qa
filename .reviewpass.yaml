# reviewpass configuration. Secrets live in repository settings. The workflow
# sets the model again through the environment, which wins over this file, so a
# branch cannot choose where its own review runs.
model:
  backend: claude-code
  name: sonnet
  verifyModel: sonnet
  reasoningEffort: low

review:
  # Only a critical finding requests changes; everything else is a comment.
  requestChangesAt: critical

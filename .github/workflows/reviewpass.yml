name: reviewpass

# Automated pull request review. Same setup as Magic Pages' other repositories:
# the review runs on our own runner and posts as our own GitHub App. Pull
# requests from forks are skipped; collaborators can still ask for a review with
# an `@reviewpass review` comment.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  group: reviewpass-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}-${{ github.event.comment.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      (github.event_name == 'issue_comment'
        || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'pull_request'
        || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || (github.event_name == 'pull_request_review_comment'
          && (github.event.comment.in_reply_to_id != null
              || contains(github.event.comment.body, format('@{0}', vars.REVIEWPASS_MENTION || 'reviewpass'))))
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && contains(github.event.comment.body, format('@{0}', vars.REVIEWPASS_MENTION || 'reviewpass'))))
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 60

    steps:
      - name: Put the Claude Code CLI on PATH, signed in
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          if ! env -u ANTHROPIC_API_KEY claude auth status | grep -Eq '"loggedIn"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::Claude Code is not signed in: set CLAUDE_CODE_OAUTH_TOKEN from \`claude setup-token\`."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          persist-credentials: false

      - uses: magicpages/reviewpass@f2cbbfe443223ae48132dfe102493746e3f16a05 # v1.16.1
        id: review
        with:
          app-id: ${{ secrets.REVIEWPASS_APP_ID }}
          private-key: ${{ secrets.REVIEWPASS_PRIVATE_KEY }}
        env:
          REVIEWPASS_BACKEND: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEWPASS_MODEL: sonnet
          REVIEWPASS_VERIFY_MODEL: sonnet
          REVIEWPASS_REASONING_EFFORT: low
          REVIEWPASS_CONCURRENCY: 4

      - name: Fail when nothing was reviewed
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEWED_FILES: ${{ steps.review.outputs.reviewed-files }}
          FAILED_FILES: ${{ steps.review.outputs.failed-files }}
        run: |
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            echo "::error::the review step did not succeed (outcome: $REVIEW_OUTCOME), so nothing was reviewed."
            exit 1
          fi

          if [ -z "$REVIEWED_FILES" ] || [ -z "$FAILED_FILES" ]; then
            echo "reviewpass reported no file outputs to judge — not failing on that."
            exit 0
          fi

          if [ "$REVIEWED_FILES" = "0" ] && [ "$FAILED_FILES" != "0" ]; then
            echo "::error::reviewpass reviewed nothing: 0 files reviewed, $FAILED_FILES failed."
            echo "The review did not happen — the Claude CLI was missing, not signed in, or at its usage limit —"
            echo "so this pull request carries no independent review. That says nothing about the change (see #3416)."
            echo "Check that claude is installed for the runner user and that CLAUDE_CODE_OAUTH_TOKEN is valid."
            exit 1
          fi

          echo "reviewpass reviewed $REVIEWED_FILES file(s), $FAILED_FILES failed."
